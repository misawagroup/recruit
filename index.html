<style>
/* Layout: 一冊の本。奉優会パンフの組み方（全面写真の表紙・ページごとの淡い色の紙・縦書きの見出し・細い罫線・大きな番号・白抜きの英字ロゴ）に、
   採用サイトの緑と黄緑のマーカーを合わせる。文字と写真はすべて content.json（更新用シート）から読み込む。台（stage）は閲覧者のテーマに追従し、ページは常に紙の色。印刷時は同じページをA4縦に1枚ずつ並べる */
:root {
  /* 紙（ページ）— テーマに関係なく紙の色 */
  --paper: #FFFFFF;
  --paper-2: #EFF7EC;
  --ink: #1E2823;
  --ink-soft: #56645C;
  --rule: #DCE8DF;
  --green: #1E9A5A;        /* ロゴの緑（大きな文字・面に使う） */
  --green-deep: #13693F;   /* 小さな文字に使う緑 */
  --green-ink: #FFFFFF;
  --green-soft: #BFE3CC;
  --lime: #DDEB5B;         /* マーカー・アクセント（オフィスのいすの黄緑） */
  --shu: #D2462E;          /* はんこ */
  /* 台（ページの外側） */
  --stage: #E6EEE8;
  --stage-ink: #1B2822;
  --stage-soft: #56685E;
  --surface: #FFFFFF;
  --surface-line: #C3D0C7;
  --accent: #13693F;
  --accent-ink: #FFFFFF;
  --focus: #13693F;
  --shadow: rgba(24, 38, 31, .18);
  /* 書体 */
  --f-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --f-fig: "Barlow Condensed", "Arial Narrow", "Zen Kaku Gothic New", sans-serif;
  --f-script: "Allura", "Snell Roundhand", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #101713; --stage-ink: #DCE6E0; --stage-soft: #92A49A;
    --surface: #19221D; --surface-line: #2E3C34;
    --accent: #7FD3A2; --accent-ink: #0D1912; --focus: #7FD3A2;
    --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #101713; --stage-ink: #DCE6E0; --stage-soft: #92A49A;
  --surface: #19221D; --surface-line: #2E3C34;
  --accent: #7FD3A2; --accent-ink: #0D1912; --focus: #7FD3A2;
  --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background: var(--stage);
  color: var(--stage-ink);
  font-family: var(--f-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

/* ===== 台 ===== */
.app {
  max-width: 1120px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.topline {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 4px 16px;
}
.brand {
  margin: 0;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .06em;
}
.sample-note {
  margin: 0;
  font-size: 12px;
  color: var(--stage-soft);
  line-height: 1.6;
}
.sample-note b { color: var(--stage-ink); font-weight: 700; }

.book-wrap {
  width: 100%;
  max-width: min(1040px, calc((100vh - 230px) * 1.414));
  max-width: min(1040px, calc((100dvh - 230px) * 1.414));
  min-width: 0;
}
.book { width: 100%; }
/* スマホで戻るときのめくり（前のページが左の綴じ目を軸にして戻ってくる） */
.backflip { position: fixed; z-index: 50; perspective: 1400px; pointer-events: none; }
.backflip-leaf {
  position: absolute;
  inset: 0;
  overflow: hidden;
  transform-origin: left center;
  backface-visibility: hidden;
  box-shadow: 0 0 24px rgba(0, 0, 0, .18);
  animation: backflip-leaf .9s cubic-bezier(.45, .1, .3, 1) both;
}
.backflip-leaf > * { width: 100%; height: 100%; }
.backflip-shade { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0, 0, 0, .25), rgba(0, 0, 0, 0) 70%); animation: backflip-shade .9s ease-out both; }
@keyframes backflip-leaf {
  from { transform: rotateY(-88deg); filter: brightness(.8); }
  to   { transform: rotateY(0deg); filter: brightness(1); }
}
@keyframes backflip-shade { from { opacity: 0; } 40% { opacity: 1; } to { opacity: 0; } }
.book .page {
  background: var(--paper);
  box-shadow: inset 0 0 0 1px var(--rule);
}
.status {
  margin: 0;
  padding: 64px 8px;
  text-align: center;
  font-size: 14px;
  line-height: 1.8;
  color: var(--stage-soft);
}

.controls {
  display: flex;
  align-items: center;
  gap: 18px;
}
.nav-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--surface-line);
  background: var(--surface);
  color: var(--stage-ink);
  display: grid; place-items: center;
  cursor: pointer;
  transition: transform .15s ease, border-color .15s ease;
}
.nav-btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.nav-btn:disabled { opacity: .35; cursor: default; }
.nav-btn svg { width: 18px; height: 18px; }
.page-no {
  min-width: 7.5em;
  text-align: center;
  font-family: var(--f-fig);
  font-weight: 500;
  font-size: 17px;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
}
.page-no small { font-family: var(--f-body); font-size: 12px; letter-spacing: .04em; color: var(--stage-soft); }
.hint { margin: -6px 0 0; font-size: 12px; color: var(--stage-soft); text-align: center; }
.rights { align-self: stretch; width: 100%; max-width: 1080px; margin: 6px auto 0; padding-inline: 16px; box-sizing: border-box; font-size: 10px; color: var(--stage-soft); text-align: right; }
/* 写真の長押し保存・右クリック保存・ドラッグをしにくくする */
.pg img { -webkit-touch-callout: none; -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
.print-btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 11px 20px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .04em;
  cursor: pointer;
}
.print-btn svg { width: 18px; height: 18px; }
.print-btn:hover { filter: brightness(1.08); }

/* ===== ページ共通（本と印刷で同じ中身を使う） ===== */
.pg {
  width: 100%;
  height: 100%;
  container-type: inline-size;
  position: relative;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  /* --fit：文字が多くてページに収まらないとき、自動で小さくする倍率 */
  --fit: 1;
  /* 文字はスマホでの最小サイズを守り、A4印刷では紙の幅に合わせて縮尺する */
  --pad: max(20px, 7.4cqw);
  --gap: calc(max(10px, 3.2cqw) * var(--fit));
  --t-body: calc(max(12.5px, 2.25cqw) * var(--fit));
  --t-small: calc(max(10px, 1.7cqw) * var(--fit));
  --t-label: calc(max(11.5px, 2cqw) * var(--fit));
  --t-h: calc(max(20px, 5.6cqw) * var(--fit));
  --t-fig: calc(max(40px, 12.5cqw) * var(--fit));
}
/* ページごとの紙の色（奉優会パンフのように、ページで色を変える） */
.pg-work    { --paper: #FBF6DC; }
.pg-numbers { --paper: #FFFFFF; }
.pg-senpai  { --paper: #E6EEF5; }
.pg-open    { --paper: #E7F3EA; }
.pg-body {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  padding: var(--pad);
}
/* ページ上端の二重の帯（帳簿の二重罫） */
.pg-inner::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: max(6px, 1.3cqw);
  border-top: max(3px, .7cqw) solid var(--green);
  border-bottom: 1px solid var(--green);
}
.rh {
  position: relative;
  font-size: var(--t-small);
  color: var(--ink-soft);
  letter-spacing: .06em;
}
/* 見出しの番号ラベル（「IDEA 01」のような枠） */
.en {
  position: relative;
  align-self: flex-start;
  display: flex;
  align-items: center;
  gap: max(8px, 1.8cqw);
  padding-block: max(4px, .9cqw);
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
}
.en-tag {
  display: grid;
  place-items: center;
  min-width: calc(max(34px, 8cqw) * var(--fit));
  aspect-ratio: 1;
  padding: 0 .4em;
  border-radius: 50%;
  background: var(--lime);
  color: var(--ink);
  font-family: var(--f-fig);
  font-weight: 700;
  font-size: calc(max(10px, 1.8cqw) * var(--fit));
  letter-spacing: .04em;
}
.en-no {
  font-family: var(--f-fig);
  font-weight: 600;
  font-size: calc(max(34px, 10cqw) * var(--fit));
  line-height: .9;
  color: var(--green);
}
.en-ja { font-size: var(--t-label); font-weight: 900; line-height: 1.35; color: var(--ink); max-width: 14em; }
.h {
  position: relative;
  margin: 0;
  font-weight: 900;
  font-size: var(--t-h);
  line-height: 1.45;
  letter-spacing: .02em;
  color: var(--ink);
}
/* 黄緑のマーカー */
.mk {
  /* 単色の帯を下寄りに敷く（グラデーションの境目だと、印刷したPDFに細い線が出ることがある） */
  background: linear-gradient(var(--lime), var(--lime)) no-repeat 0 91.2% / 100% 32%;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  padding-inline: .06em;
}
.lead {
  position: relative;
  margin: 0;
  font-size: var(--t-body);
  line-height: 1.85;
  color: var(--ink);
}
.pf {
  margin-top: auto;
  display: flex;
  font-family: var(--f-fig);
  font-weight: 500;
  font-size: var(--t-label);
  letter-spacing: .08em;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.pf.is-odd { justify-content: flex-end; }
/* 写真（共通） */
.ph { position: relative; overflow: hidden; background: #DCE6DF; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; }

/* 白抜きのロゴ風の英字（表紙・裏表紙） */
.lockup { margin: 0; font-family: var(--f-fig); font-weight: 700; line-height: .84; color: #FFFFFF; letter-spacing: .01em; }
.lockup span { display: block; white-space: nowrap; }
.lockup .lk-big { font-size: calc(max(48px, 17cqw) * var(--fit)); }
.lockup .lk-small { font-size: calc(max(16px, 5.4cqw) * var(--fit)); line-height: 1.1; color: var(--lime); letter-spacing: .06em; padding-left: .1em; }

/* --- 表紙（右下の大きな丸に写真＋白抜きの英字＋下の白い帯） --- */
.pg-cover { background: var(--green-deep); color: #FFFFFF; }
.pg-cover::after {
  content: "";
  position: absolute;
  right: 54cqw;
  top: 70cqw;
  width: 10cqw;
  aspect-ratio: 1;
  border-radius: 50%;
  border: max(2px, .5cqw) solid var(--lime);
  opacity: .9;
  z-index: 1;
}
/* 丸と飾りの入れもの（はみ出した分は切る） */
.cv-deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
/* 写真が入る丸（写真がないときは緑の丸） */
.cv-bg {
  position: absolute;
  right: -26cqw;
  top: 56cqw;
  width: 92cqw;
  aspect-ratio: 1;
  border-radius: 50%;
  overflow: hidden;
  background: var(--green);
  opacity: .55;
}
.cv-bg.has-img { opacity: 1; }
.cv-bg img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* 写真の上でも白い文字が読めるように、少し緑をかける */
.cv-bg.has-img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(10, 60, 36, .35) 0%, rgba(10, 60, 36, .05) 40%, rgba(10, 60, 36, 0) 100%);
}
.pg-cover .pg-body { padding-bottom: 0; }
.pg-cover .lockup .lk-big { font-size: calc(max(44px, 15cqw) * var(--fit)); }
.pg-cover .cv-message { text-shadow: 0 1px 10px rgba(0, 0, 0, .25); }
.cv-top {
  position: relative;
  display: flex;
  justify-content: flex-end;
  align-items: baseline;
  gap: .8em;
  font-family: var(--f-fig);
  font-weight: 600;
  font-size: var(--t-label);
  letter-spacing: .16em;
  color: #FFFFFF;
}
.cv-top b { font-weight: 700; color: var(--ink); background: var(--lime); padding: .1em .6em; border-radius: 999px; letter-spacing: .1em; }
.cv-main {
  flex: 1;
  position: relative;
  min-height: 0;
}
.cv-en { position: absolute; right: 0; top: 0; text-align: right; }
.cv-en .lk-small { padding-left: 0; padding-right: .1em; }
.cv-script {
  display: block;
  font-family: var(--f-script);
  font-weight: 400;
  font-size: max(22px, 6.4cqw);
  line-height: 1.1;
  color: var(--lime);
  letter-spacing: 0;
}
.cv-message {
  position: absolute;
  left: 0;
  bottom: max(10px, 3cqw);
  margin: 0;
  writing-mode: vertical-rl;
  font-family: var(--f-display);
  font-weight: 900;
  font-size: calc(max(22px, 5.8cqw) * var(--fit));
  line-height: 1.6;
  letter-spacing: .08em;
  color: #FFFFFF;
}
/* 下の白い帯（ロゴマーク＋事務所名） */
.cv-foot {
  position: relative;
  margin-inline: calc(var(--pad) * -1);
  padding: max(14px, 4.2cqw) var(--pad) max(16px, 4.8cqw);
  background: #FFFFFF;
  color: var(--ink);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: max(10px, 3cqw);
}
.cv-logo { flex: none; height: max(40px, 11cqw); width: auto; max-width: 30cqw; object-fit: contain; }
.cv-foot-text { display: flex; flex-direction: column; gap: max(3px, .8cqw); min-width: 0; }
.cv-foot:not(.has-logo) .cv-foot-text { align-items: center; text-align: center; }
.cv-sub { margin: 0; font-size: var(--t-small); font-weight: 500; letter-spacing: .08em; color: var(--ink-soft); }
.cv-name { margin: 0; font-weight: 900; font-size: calc(max(20px, 4.6cqw) * var(--fit)); letter-spacing: .14em; color: var(--name-color, var(--green-deep)); }

/* --- しごと（右上の写真、「13のこと」風の番号リスト） --- */
/* 右上の大きな写真：見出しの後ろに入り、左と下はページの色にとけこむ */
.wk-photo {
  position: absolute;
  top: 0;
  right: 0;
  width: 72cqw;
  height: 66cqw;
  background: var(--paper);
}
.wk-photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to right, var(--paper) 0%, rgba(251, 246, 220, .85) 22%, rgba(251, 246, 220, 0) 62%),
    linear-gradient(to top, var(--paper) 0%, rgba(251, 246, 220, .8) 25%, rgba(251, 246, 220, 0) 65%);
}
.pg-work .en { background: var(--paper); padding-right: max(8px, 2cqw); }
.work-list { position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--ink); }
.work-list li {
  display: grid;
  grid-template-columns: max(44px, 12cqw) minmax(0, 1fr);
  gap: max(8px, 2cqw);
  align-items: start;
  padding-block: calc(max(10px, 2.8cqw) * var(--fit));
  border-bottom: 1px solid var(--rule);
}
.wl-no {
  font-family: var(--f-fig);
  font-weight: 600;
  font-size: calc(max(30px, 8cqw) * var(--fit));
  line-height: .9;
  color: var(--green);
}
.wl-k { display: flex; align-items: center; gap: .3em; font-size: calc(max(14px, 2.9cqw) * var(--fit)); font-weight: 900; color: var(--ink); line-height: 1.5; }
.wl-ini {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.9em;
  height: 1.9em;
  border-radius: 50%;
  background: var(--green-deep);
  color: #FFFFFF;
  font-size: 1.3em;
  line-height: 1;
  box-shadow: .12em .12em 0 var(--lime);
}
.wl-v { margin: max(3px, .6cqw) 0 0; font-size: var(--t-body); line-height: 1.75; color: var(--ink); }

/* --- 数字（「DATAで見る」風：細い大きな数字、縦書きの見出し、下段に写真） --- */
.num-main { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.num-wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: max(10px, 3cqw); align-items: start; }
.num-title {
  margin: 0;
  writing-mode: vertical-rl;
  font-family: var(--f-display);
  font-weight: 900;
  font-size: calc(max(20px, 5cqw) * var(--fit));
  line-height: 1.5;
  letter-spacing: .12em;
  color: var(--ink);
  padding-left: max(6px, 1.6cqw);
  border-left: 1px solid var(--ink);
}
.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--ink);
}
.stat {
  padding: calc(max(12px, 3.6cqw) * var(--fit)) max(6px, 1.6cqw) calc(max(12px, 3.4cqw) * var(--fit));
  border-bottom: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: max(4px, 1cqw);
  min-width: 0;
}
.stat:nth-child(odd) { border-right: 1px solid var(--rule); }
.stat-k { order: -1; font-size: var(--t-label); font-weight: 700; line-height: 1.45; color: var(--ink); }
.stat-k::before { content: ""; display: inline-block; width: .55em; height: .55em; margin-right: .4em; border-radius: 50%; background: var(--lime); vertical-align: .08em; }
.stat-fig {
  align-self: center;
  font-family: var(--f-fig);
  font-weight: 300;
  font-size: var(--t-fig);
  line-height: 1;
  color: var(--green);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.stat-fig small { font-family: var(--f-body); font-weight: 700; font-size: .3em; margin-left: .15em; letter-spacing: 0; color: var(--ink); }
.note { position: relative; margin: 0; font-size: var(--t-small); color: var(--ink-soft); }
.num-photo { flex: 1 1 0; min-height: 34cqw; border-radius: max(10px, 2.4cqw); }
.pg-numbers .pg-body { --gap: calc(max(8px, 2.4cqw) * var(--fit)); }
.perks { position: relative; }
.perks-h {
  margin: 0 0 max(5px, 1.4cqw);
  font-size: var(--t-label);
  font-weight: 700;
  color: var(--green-deep);

}
.perks-h::before { content: ""; display: inline-block; width: 1.4em; height: 1px; margin-right: .5em; background: var(--green-deep); vertical-align: .3em; }
.perks ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: max(5px, 1.2cqw); }
.perks li {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 2.9em;
  font-size: calc(max(10.5px, 1.85cqw) * var(--fit));
  font-weight: 700;
  line-height: 1.3;
  text-align: center;
  color: var(--ink);
  background: #F1F6F2;
  border: 1px solid var(--rule);
  border-top: max(2px, .5cqw) solid var(--lime);
  border-radius: max(6px, 1.4cqw);
  padding: .4em .2em;
  letter-spacing: 0;
  overflow-wrap: anywhere;
}

/* --- 先輩（「My career up!」風：大きな写真と縦書きのひとこと） --- */
.sp-head { position: relative; display: grid; grid-template-columns: 52% minmax(0, 1fr); gap: max(10px, 3cqw); align-items: start; }
.photo {
  aspect-ratio: 4 / 5;
  max-width: 100%;
  border-radius: max(10px, 2.4cqw);
  background:
    radial-gradient(circle at 50% 38%, #C9D9E6 0 17%, transparent 17.5%),
    radial-gradient(ellipse at 50% 100%, #C9D9E6 0 42%, transparent 42.5%),
    #F6F9FC;
  display: grid;
  place-items: end center;
  padding-bottom: max(6px, 1.4cqw);
  font-size: var(--t-small);
  color: var(--ink-soft);
  letter-spacing: .08em;
}
.photo.has-img { padding: 0; overflow: hidden; background: #F6F9FC; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.sp-quote {
  margin: 0;
  justify-self: end;
  height: calc((100cqw - var(--pad) * 2) * .52 * 1.25);
  writing-mode: vertical-rl;
  font-family: var(--f-display);
  font-weight: 900;
  font-size: calc(max(15px, 3.6cqw) * var(--fit));
  line-height: 1.75;
  letter-spacing: .08em;
  color: var(--ink);
  overflow: hidden;
}
.sp-tag {
  position: relative;
  align-self: flex-start;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: .2em max(10px, 2.4cqw);
  padding: max(6px, 1.4cqw) max(10px, 2.4cqw);
  background: var(--lime);
}
.sp-name { margin: 0; font-weight: 900; font-size: calc(max(17px, 4cqw) * var(--fit)); line-height: 1.2; }
.sp-meta { margin: 0; font-size: var(--t-small); color: var(--ink); line-height: 1.5; }
.qa { position: relative; margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--ink); }
.qa > div { padding-block: calc(max(7px, 1.8cqw) * var(--fit)); border-bottom: 1px solid #C9D6E2; }
.qa dt { display: flex; align-items: center; gap: .5em; font-size: var(--t-label); font-weight: 900; color: var(--ink); }
.qa dt::before {
  content: "Q";
  flex: none;
  display: grid; place-items: center;
  width: 1.7em; height: 1.7em;
  border-radius: 50%;
  background: var(--green-deep);
  color: #FFFFFF;
  font-family: var(--f-fig);
  font-weight: 700;
}
.qa dd { margin: 3px 0 0 calc(var(--t-label) * 2.2); font-size: var(--t-body); line-height: 1.7; }

/* --- オープンカンパニー／仕事体験（上下2段） --- */
.ev { position: relative; display: flex; flex-direction: column; gap: calc(max(5px, 1.5cqw) * var(--fit)); }
.ev + .ev { padding: calc(max(8px, 2.6cqw) * var(--fit)) max(12px, 3cqw); background: #FFFFFF; border-top: max(3px, .6cqw) solid var(--green); }
.ev-step {
  align-self: flex-start;
  font-family: var(--f-fig);
  font-weight: 700;
  font-size: var(--t-small);
  letter-spacing: .12em;
  color: #FFFFFF;
  background: var(--green-deep);
  padding: .15em .7em;
  border-radius: 999px;
}
.ev .h { font-size: calc(max(16px, 4.2cqw) * var(--fit)); line-height: 1.4; }
.ev .lead { line-height: 1.65; font-size: var(--t-label); }
.ev .details dt, .ev .details dd { font-size: var(--t-label); }
.ev .cta { font-size: var(--t-label); }
.ev-row { display: flex; align-items: center; gap: max(10px, 2.6cqw); }
.details { position: relative; flex: 1; min-width: 0; margin: 0; display: grid; grid-template-columns: calc(var(--t-label) * 4.4) minmax(0, 1fr); border-top: 1px solid var(--ink); }
.details dt, .details dd { padding-block: calc(max(4px, 1.1cqw) * var(--fit)); border-bottom: 1px solid var(--rule); font-size: var(--t-body); line-height: 1.55; margin: 0; }
.details dt { font-weight: 900; color: var(--green-deep); font-size: var(--t-label); }
.ev-row .qr { width: max(64px, 15cqw); }
.cta-area { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.cta {
  display: inline-flex; align-items: center; gap: 10px;
  padding: calc(max(9px, 1.6cqw) * var(--fit)) max(16px, 3.4cqw);
  border-radius: 999px;
  border: 0;
  background: var(--green-deep);
  color: #FFFFFF;
  font-weight: 700;
  font-size: var(--t-body);
  letter-spacing: .04em;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 max(3px, .7cqw) 0 var(--lime);
}
.cta svg { width: 1.1em; height: 1.1em; flex: none; }
.cta-msg { margin: 0; font-size: var(--t-small); color: var(--shu); }
.cta-msg:empty { display: none; }
.qr { width: max(80px, 19cqw); flex: none; background: #FFFFFF; padding: max(4px, .8cqw); }
.qr svg { display: block; width: 100%; height: auto; }
.qr svg rect { fill: #FFFFFF; }
.qr svg path { fill: var(--ink); }
.qr-text { margin: 0; font-size: var(--t-small); line-height: 1.6; color: var(--ink-soft); overflow-wrap: anywhere; }
.qr-text b { color: var(--ink); }

/* --- 裏表紙 --- */
.pg-back { background: var(--green-deep); color: #FFFFFF; }
.pg-back::before {
  content: "";
  position: absolute;
  left: -28cqw;
  top: -20cqw;
  width: 80cqw;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--green);
  opacity: .55;
}
.pg-back .pg-body { justify-content: space-between; }
.bk-top { position: relative; display: flex; flex-direction: column; gap: max(8px, 2cqw); }
.bk-top .lk-big { font-size: calc(max(36px, 12cqw) * var(--fit)); }
.bk-msg { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: var(--t-label); letter-spacing: .12em; color: var(--green-soft); }
.bk-main { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; gap: max(8px, 1.8cqw); }
.bk-script { font-family: var(--f-script); font-size: max(24px, 7cqw); line-height: 1; color: var(--lime); }
.bk-name { margin: 0; font-weight: 900; font-size: calc(max(26px, 6.4cqw) * var(--fit)); letter-spacing: .12em; line-height: 1.3; }
.bk-desc { margin: 0; font-size: var(--t-body); line-height: 1.7; }
/* 筆記体〜紹介文の3行は、上の英字と下の連絡先のちょうど真ん中に置く */
.bk-main > :first-child { margin-top: auto; }
.bk-desc { margin-bottom: auto !important; }
/* 連絡先は白い線のすぐ上に寄せる */
.bk-contact { margin: 0 0 max(4px, 1.2cqw); padding-top: max(8px, 2cqw); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px max(12px, 2.6cqw); font-size: var(--t-body); }
.bk-contact dt { font-family: var(--f-fig); font-weight: 600; letter-spacing: .1em; color: var(--lime); }
.bk-contact dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bk-web { position: relative; display: flex; align-items: center; gap: max(12px, 3cqw); padding-top: max(10px, 2.4cqw); border-top: 1px solid var(--green-soft); }
.bk-rights { position: relative; margin: calc(var(--gap) * -.5) 0 0; font-size: calc(max(8.5px, 1.35cqw) * var(--fit)); text-align: right; opacity: .7; letter-spacing: .02em; }
.bk-web .qr { width: max(70px, 15cqw); border-radius: max(4px, .8cqw); }
.bk-web p { margin: 0; font-size: var(--t-small); line-height: 1.7; overflow-wrap: anywhere; min-width: 0; }

/* ページめくりの部品が読めなかったときの代わり（横スクロールで1ページずつ） */
.book.is-fallback { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.book.is-fallback .page { flex: 0 0 min(100%, 420px); aspect-ratio: 210 / 297; scroll-snap-align: center; box-shadow: 0 6px 18px var(--shadow); }

/* 文字の量を測るための見えない箱 */
.measure { position: absolute; left: -10000px; top: 0; visibility: hidden; pointer-events: none; }

/* ===== 印刷レイアウト（画面ではプレビューとして重ねて表示） ===== */
.print-root { display: none; }
.print-root.is-open {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 50;
  overflow-y: auto;
  background: var(--stage);
  color: var(--stage-ink);
}
.print-bar {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--surface-line);
}
.print-bar div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.print-bar strong { font-size: 14px; }
.print-bar span { font-size: 12px; color: var(--stage-soft); line-height: 1.5; }
.close-btn {
  flex: none;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--surface-line);
  background: var(--surface);
  color: var(--stage-ink);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.sheets {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding-top: 24px;
  padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  width: min(100%, 720px);
  aspect-ratio: 210 / 297;
  max-width: 100%;
  box-shadow: 0 8px 24px var(--shadow);
}
.sheet-label { margin: 0 0 -14px; font-family: var(--f-fig); font-size: 13px; letter-spacing: .1em; color: var(--stage-soft); }

@page { size: A4 portrait; margin: 0; }
@media print {
  :root { padding: 0 !important; }
  body { background: none; }
  .app, .print-bar, .sheet-label, .measure { display: none !important; }
  .print-root { display: block !important; position: static !important; overflow: visible !important; background: none !important; }
  .sheets { display: block !important; padding: 0 !important; }
  .sheet { width: 210mm !important; height: 297mm !important; max-width: none !important; aspect-ratio: auto !important; box-shadow: none !important; break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}

@media (prefers-reduced-motion: reduce) {
  .nav-btn { transition: none; }
}

<body>

<div class="app">
  <div class="topline">
    <p id="brand" class="brand">採用パンフレット</p>
    <p id="sampleNote" class="sample-note" hidden><b>試作版</b>　文章・数字・写真はすべてサンプルです</p>
  </div>

  <div class="book-wrap">
    <div id="book" class="book" aria-label="採用パンフレット">
      <p class="status">読み込んでいます…</p>
    </div>
  </div>

  <div id="controls" class="controls" hidden>
    <button id="prev" class="nav-btn" type="button" aria-label="前のページ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span id="pageNo" class="page-no" aria-live="polite">表紙</span>
    <button id="next" class="nav-btn" type="button" aria-label="次のページ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <p id="hint" class="hint" hidden>ページの端をタップするか、スワイプでめくれます</p>

  <button id="printBtn" class="print-btn" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>
    <span id="printLabel">印刷・PDFで保存</span>
  </button>
  <p id="rights" class="rights" hidden></p>
</div>

<section id="printRoot" class="print-root" aria-label="印刷レイアウト">
  <div class="print-bar">
    <div>
      <strong id="printTitle">印刷するとこうなります（A4縦）</strong>
      <span>パンフレットを単独のページで開いたときは、このボタンで印刷画面が開きます。</span>
    </div>
    <button id="closePrint" class="close-btn" type="button">閉じる</button>
  </div>
  <div id="sheets" class="sheets"></div>
</section>

<div id="measure" class="measure" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// ─────────────────────────────────────────────
// パンフレットの中身は content.json から読み込みます。
// content.json は、更新用スプレッドシートの［サイトに反映する］で
// 自動的に書き換わります。このファイル（デザイン）は触らなくて大丈夫です。
// ─────────────────────────────────────────────
const CONTENT_URL = "content.json";

// 単独のページで開いたときは印刷画面を開く。
// 他のページの中に埋め込まれているとき（プレビューなど）は印刷できないことがあるので、印刷レイアウトを画面に表示する。
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const CAN_PRINT = !IN_FRAME;

// content.json にない項目（古い content.json のとき）だけに使う文字。ふだんはシートの文字が使われる
const DEFAULTS = {
  common: { rights: "掲載している写真・文章の無断転載・転用を禁じます。", label: "採用パンフレット", webNote: "最新の内容はウェブ版でご覧いただけます", qrNote: "スマートフォンでQRコードを読み取ると、申込みページが開きます。" },
  cover: { tag: "RECRUIT GUIDE", script: "You know...", en1: "BEYOND", en2: "THE", en3: "NUMBERS." },
  work: { en: "WORK", label: "しごと" },
  numbers: { en: "DATA", label: "数字" },
  senpai: { en: "PEOPLE", label: "先輩社員" },
  open: { en: "EVENT", label: "オープンカンパニー・仕事体験", step: "STEP 1" },
  intern: { step: "STEP 2" },
  back: { script: "See you soon." }
};
function withDefaults(c) {
  Object.keys(DEFAULTS).forEach(sec => {
    c[sec] = c[sec] || {};
    Object.keys(DEFAULTS[sec]).forEach(k => { if (c[sec][k] === undefined) c[sec][k] = DEFAULTS[sec][k]; });
  });
  c.photos = c.photos || {};
  return c;
}
const A4_W = 794; // A4の幅（px）

let C = null;      // 読み込んだ中身
let L = {};        // 共通の文字（C.common）
let IS_SAMPLE = false;

// ─── 共通の部品 ───
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nl = s => esc(s).replace(/\n/g, "<br>");
const filled = arr => (Array.isArray(arr) ? arr : []).filter(o => o && Object.values(o).some(v => String(v || "").trim()));
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function qrSvg(url) {
  if (!window.qrcode || !url) return "";
  try {
    const q = qrcode(0, "M");
    q.addData(url);
    q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: "QRコード" });
  } catch (e) { return ""; }
}
function runningHead() {
  return `<header class="rh">${esc(C.company)}　${esc(L.label)}</header>`;
}
// 番号つきの見出しラベル（例：［WORK］01 しごと）
function enHead(sec, n) {
  return `<div class="en"><span class="en-tag" aria-hidden="true">${esc(sec.en)}</span><span class="en-no" aria-hidden="true">${String(n - 1).padStart(2, "0")}</span><span class="en-ja">${esc(sec.label)}</span></div>`;
}
function heading(text) {
  return `<h2 class="h"><span class="mk">${nl(text)}</span></h2>`;
}
// 仕事の名前：頭の1文字を丸で囲む（3つ並ぶと縦に読める。例：み・さ・わ）
function itemName(text) {
  const chars = Array.from(String(text || "").trim());
  if (!chars.length) return "";
  return `<span class="wl-k"><span class="wl-ini">${esc(chars[0])}</span>${nl(chars.slice(1).join(""))}</span>`;
}
function lockup() {
  const c = C.cover || {};
  return `<p class="lockup" aria-hidden="true">${[["lk-big", c.en1], ["lk-small", c.en2], ["lk-big", c.en3]]
    .filter(([, t]) => String(t || "").trim()).map(([k, t]) => `<span class="${k}">${esc(t)}</span>`).join("")}</p>`;
}
function photoTag(key, cls, alt) {
  const src = (C.photos || {})[key];
  return src ? `<div class="ph ${cls}"><img src="${esc(src)}" alt="${esc(alt)}"></div>` : "";
}
// 申込み：画面ではボタン、印刷ではQRコード
function applyAction(url, button, print) {
  if (!String(url || "").trim()) return "";
  if (print) return `<div class="qr">${qrSvg(url)}</div>`;
  return `<div class="cta-area">
      <a class="cta" href="${esc(url)}" target="_blank" rel="noopener" data-apply>${esc(button)}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <p class="cta-msg" aria-live="polite"></p>
    </div>`;
}
function eventBlock(e, step, print) {
  if (!e || !String(e.title || "").trim()) return "";
  const action = applyAction(e.applyUrl, e.button, print);
  return `
    <section class="ev">
      ${String(step || "").trim() ? `<span class="ev-step">${esc(step)}</span>` : ""}
      ${heading(e.title)}
      ${String(e.lead || "").trim() ? `<p class="lead">${nl(e.lead)}</p>` : ""}
      <div class="ev-row">
        <dl class="details">${filled(e.details).map(d => `<dt>${esc(d.k)}</dt><dd>${nl(d.v)}</dd>`).join("")}</dl>
        ${print ? action : ""}
      </div>
      ${print ? "" : action}
    </section>`;
}
// 福利厚生：小さな札を並べる（空の行は出さない）
function perks(m) {
  const list = filled(m.perks);
  if (!list.length) return "";
  return `<div class="perks">
      ${String(m.perksTitle || "").trim() ? `<p class="perks-h">${esc(m.perksTitle)}</p>` : ""}
      <ul>${list.map(p => `<li>${esc(p.k)}</li>`).join("")}</ul>
    </div>`;
}
function folio(n) {
  return `<footer class="pf ${n % 2 ? "is-odd" : ""}">P.${String(n).padStart(2, "0")}</footer>`;
}
function webUrl() {
  return (C.back && C.back.webUrl) || location.href.split("#")[0];
}

// ─── ページごとの中身（本と印刷の両方でこの関数を使う） ───
const PAGES = [
  { type: "cover", hard: true, render: () => {
      const c = C.cover || {};
      const p = C.photos || {};
      return `
        <div class="cv-deco" aria-hidden="true"><div class="cv-bg${p.cover ? " has-img" : ""}">${p.cover ? `<img src="${esc(p.cover)}" alt="">` : ""}</div></div>
        <div class="cv-top"><span>${esc(c.tag)}</span>${String(c.year || "").trim() ? `<b>${esc(c.year)}</b>` : ""}</div>
        <div class="cv-main">
          <div class="cv-en">${String(c.script || "").trim() ? `<span class="cv-script" aria-hidden="true">${esc(c.script)}</span>` : ""}${lockup()}</div>
          <h1 class="cv-message">${nl(c.message)}</h1>
        </div>
        <div class="cv-foot${p.logo ? " has-logo" : ""}">
          ${p.logo ? `<img class="cv-logo" src="${esc(p.logo)}" alt="">` : ""}
          <div class="cv-foot-text">
            ${String(c.sub || "").trim() ? `<p class="cv-sub">${esc(c.sub)}</p>` : ""}
            <p class="cv-name">${esc(C.company)}</p>
          </div>
        </div>`;
  }},
  { type: "work", inner: true, render: n => {
      const w = C.work || {};
      return `
        ${photoTag("work", "wk-photo", w.label)}
        ${runningHead()}
        ${enHead(w, n)}
        ${heading(w.title)}
        <p class="lead">${nl(w.lead)}</p>
        <ul class="work-list">
          ${filled(w.items).map((i, k) => `<li><span class="wl-no" aria-hidden="true">${String(k + 1).padStart(2, "0")}</span><div>${itemName(i.k)}<p class="wl-v">${nl(i.v)}</p></div></li>`).join("")}
        </ul>
        ${folio(n)}`;
  }},
  { type: "numbers", inner: true, render: n => {
      const m = C.numbers || {};
      return `
        ${runningHead()}
        ${enHead(m, n)}
        <div class="num-wrap">
          <div class="num-main">
          <div class="stats">
            ${filled(m.items).map(i => `
              <div class="stat">
                <span class="stat-fig"><span data-count="${esc(i.value)}">${esc(i.value)}</span><small>${esc(i.unit)}</small></span>
                <span class="stat-k">${nl(i.k)}</span>
              </div>`).join("")}
          </div>
          ${m.note ? `<p class="note">${nl(m.note)}</p>` : ""}
          </div>
          <h2 class="num-title">${nl(m.title)}</h2>
        </div>
        ${perks(m)}
        ${photoTag("numbers", "num-photo", m.label)}
        ${folio(n)}`;
  }},
  { type: "senpai", inner: true, render: n => {
      const s = C.senpai || {};
      const src = (C.photos || {}).senpai || s.photo;
      const photo = src
        ? `<div class="photo has-img"><img src="${esc(src)}" alt="${esc(s.name)}"></div>`
        : `<div class="photo" role="img" aria-label="${esc(s.label)}">写真</div>`;
      return `
        ${runningHead()}
        ${enHead(s, n)}
        <div class="sp-head">
          ${photo}
          <p class="sp-quote">${nl(s.quote)}</p>
        </div>
        <div class="sp-tag">
          <p class="sp-name">${esc(s.name)}</p>
          <p class="sp-meta">${esc(String(s.meta || "").replace(/\n/g, "　"))}</p>
        </div>
        <dl class="qa">
          ${filled(s.qa).map(i => `<div><dt>${esc(i.q)}</dt><dd>${nl(i.a)}</dd></div>`).join("")}
        </dl>
        ${folio(n)}`;
  }},
  { type: "open", inner: true, render: (n, print) => {
      const o = C.open || {};
      const t = C.intern || {};
      const qrNote = print && (String(o.applyUrl || "").trim() || String(t.applyUrl || "").trim()) && String(L.qrNote || "").trim()
        ? `<p class="qr-text">${nl(L.qrNote)}</p>` : "";
      return `
        ${runningHead()}
        ${enHead(o, n)}
        ${eventBlock(o, o.step, print)}
        ${eventBlock(t, t.step, print)}
        ${qrNote}
        ${folio(n)}`;
  }},
  { type: "back", hard: true, render: (n, print) => {
      const b = C.back || {};
      const message = String((C.cover && C.cover.message) || "").replace(/\n/g, "");
      const qr = print ? qrSvg(webUrl()) : "";
      return `
        <div class="bk-top">
          ${lockup()}
          <p class="bk-msg">${esc(message)}</p>
        </div>
        <div class="bk-main">
          ${String(b.script || "").trim() ? `<span class="bk-script" aria-hidden="true">${esc(b.script)}</span>` : ""}
          <p class="bk-name">${esc(C.company)}</p>
          <p class="bk-desc">${nl(b.desc)}</p>
          <dl class="bk-contact">${filled(b.contact).map(c => `<dt>${esc(c.k)}</dt><dd>${esc(c.v)}</dd>`).join("")}</dl>
        </div>
        <div class="bk-web">
          ${qr ? `<div class="qr">${qr}</div>` : ""}
          <p>${nl(L.webNote)}<br>${esc(webUrl())}</p>
        </div>
        ${String(L.rights || "").trim() ? `<p class="bk-rights">${esc(L.rights)}</p>` : ""}`;
  }}
];
const total = PAGES.length;

function pageHtml(i, print) {
  const p = PAGES[i];
  const cls = `pg pg-${p.type}${p.inner ? " pg-inner" : ""}`;
  return `<div class="${cls}"><div class="pg-body">${p.render(i + 1, print)}</div></div>`;
}

// ─── 文字が多すぎるページは、収まるまで文字を少しずつ小さくする ───
const measure = document.getElementById("measure");
const hits = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
function overflows(pg) {
  const body = pg.firstElementChild;
  if (body.scrollHeight > body.clientHeight + 1) return true;
  const msg = pg.querySelector(".cv-message");
  if (msg) {
    const r = msg.getBoundingClientRect();
    const cs = getComputedStyle(msg);
    const colW = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.6;
    const lines = msg.querySelectorAll("br").length + 1;
    if (r.width > lines * colW + 2) return true;   // 縦書きの1行が長くて折り返している
    const main = pg.querySelector(".cv-main").getBoundingClientRect();
    if (r.bottom > main.bottom + 1 || r.top < main.top - 1) return true;
    // 英字と重なっていないか
    const en = pg.querySelector(".cv-en");
    if (en && hits(r, en.getBoundingClientRect())) return true;
  }
  // 英字が横にはみ出していないか
  for (const lk of pg.querySelectorAll(".lockup")) {
    if (lk.scrollWidth > lk.clientWidth + 1) return true;
  }
  // 縦書きのひとことが、決めた高さからはみ出していないか
  const q = pg.querySelector(".sp-quote");
  if (q && q.scrollWidth > q.clientWidth + 1) return true;
  return false;
}
function fitFor(i, print, w, h) {
  measure.style.width = w + "px";
  measure.style.height = h + "px";
  measure.innerHTML = pageHtml(i, print);
  const pg = measure.firstElementChild;
  let f = 1;
  while (f > 0.7 && overflows(pg)) {
    f = Math.round((f - 0.04) * 100) / 100;
    pg.style.setProperty("--fit", f);
  }
  measure.innerHTML = "";
  return f;
}
const fitReport = window.__fitReport = { book: [], print: [] };
function applyFits(pgs, print, w, h, key) {
  pgs.forEach((pg, i) => {
    const f = fitFor(i, print, w, h);
    pg.style.setProperty("--fit", f);
    if (key) fitReport[key][i] = f;
  });
}

// ─── 本（ページめくり） ───
const book = document.getElementById("book");
const sheets = document.getElementById("sheets");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const pageNo = document.getElementById("pageNo");
const statsIndex = PAGES.findIndex(p => p.type === "numbers");
let flip = null;
let statsShown = false;

function bookPageSize() {
  if (flip) { const r = flip.getBoundsRect(); return [r.pageWidth, r.height]; }
  const first = book.querySelector(".page");
  const w = first ? first.offsetWidth : 360;
  return [w, w * 297 / 210];
}
function fitBook() {
  const [w, h] = bookPageSize();
  if (w > 0 && h > 0) applyFits(book.querySelectorAll(".page > .pg"), false, w, h, "book");
}
function fitSheets(width) {
  const w = width || A4_W;
  applyFits(sheets.querySelectorAll(".sheet > .pg"), true, w, w * 297 / 210, width ? "" : "print");
}

function visiblePages(idx) {
  if (!flip || flip.getOrientation() === "portrait") return [idx];
  if (idx === 0) return [0];
  const left = idx % 2 === 1 ? idx : idx - 1;
  return left + 1 < total ? [left, left + 1] : [left];
}
function countUp() {
  book.querySelectorAll("[data-count]").forEach(el => {
    const raw = el.dataset.count;
    const target = parseFloat(raw);
    const dec = (raw.split(".")[1] || "").length;
    if (reduceMotion || isNaN(target)) { el.textContent = raw; return; }
    const t0 = performance.now();
    const step = t => {
      const k = Math.min(1, (t - t0) / 900);
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = (target * e).toFixed(dec);
      if (k < 1) requestAnimationFrame(step); else el.textContent = raw;
    };
    requestAnimationFrame(step);
  });
}
function updateUi(idx) {
  const vis = visiblePages(idx);
  const first = vis[0], last = vis[vis.length - 1];
  let label;
  if (first === 0) label = "表紙";
  else if (first === total - 1) label = "裏表紙";
  else label = vis.length > 1 ? `${first + 1}–${last + 1} <small>/ ${total}</small>` : `${first + 1} <small>/ ${total}</small>`;
  pageNo.innerHTML = label;
  prevBtn.disabled = first === 0;
  nextBtn.disabled = last === total - 1;
  const seeStats = vis.includes(statsIndex);
  if (seeStats && !statsShown) countUp();
  statsShown = seeStats;
}

let backFlipping = false;
function flipBackPortrait() {
  const i = flip.getCurrentPageIndex();
  if (i < 1 || backFlipping) return;
  const pages = book.querySelectorAll(".page");
  const now = [...pages].find(el => el.offsetParent !== null && el.getBoundingClientRect().width > 0 && getComputedStyle(el).display !== "none" && el.style.zIndex !== "");
  const box = (now || book).getBoundingClientRect();
  const src = pages[i - 1] && pages[i - 1].firstElementChild;
  if (reduceMotion || !src || !box.width) { flip.turnToPrevPage(); return; }
  backFlipping = true;
  const stage = document.createElement("div");
  stage.className = "backflip";
  Object.assign(stage.style, { left: box.left + "px", top: box.top + "px", width: box.width + "px", height: box.height + "px" });
  const leaf = document.createElement("div");
  leaf.className = "backflip-leaf";
  leaf.appendChild(src.cloneNode(true));
  const shade = document.createElement("div");
  shade.className = "backflip-shade";
  stage.append(shade, leaf);
  document.body.appendChild(stage);
  const done = () => {
    if (!backFlipping) return;
    backFlipping = false;
    flip.turnToPage(i - 1);
    updateUi(i - 1);
    requestAnimationFrame(() => stage.remove());
  };
  leaf.addEventListener("animationend", done, { once: true });
  setTimeout(done, 1200);   // 念のため
}

function startBook() {
  book.innerHTML = PAGES.map((p, i) =>
    `<div class="page"${p.hard ? ' data-density="hard"' : ""}>${pageHtml(i, false)}</div>`).join("");
  if (window.St && St.PageFlip) {
    flip = new St.PageFlip(book, {
      width: 420, height: 594, size: "stretch",
      minWidth: 290, maxWidth: 520, minHeight: 300, maxHeight: 736,
      showCover: true, usePortrait: true, mobileScrollSupport: false,
      maxShadowOpacity: 0.35, flippingTime: reduceMotion ? 300 : 800
    });
    flip.loadFromHTML(book.querySelectorAll(".page"));
    flip.on("flip", e => updateUi(e.data));
    flip.on("changeOrientation", () => { updateUi(flip.getCurrentPageIndex()); fitBook(); });
    // スマホ（1ページ表示）で戻るときは、前のページが左からめくれて重なる動きにする
    const libPrev = flip.flipPrev.bind(flip);
    flip.flipPrev = corner => (flip.getOrientation() === "portrait" ? flipBackPortrait() : libPrev(corner));
    prevBtn.addEventListener("click", () => flip.flipPrev());
    nextBtn.addEventListener("click", () => flip.flipNext());
  } else {
    // ページめくりの部品が読めないときは、横スクロールで見せる
    book.classList.add("is-fallback");
    const pages = [...book.querySelectorAll(".page")];
    const current = () => Math.round(book.scrollLeft / (pages[0].offsetWidth + 16));
    const go = d => pages[Math.max(0, Math.min(total - 1, current() + d))].scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", inline: "center", block: "nearest" });
    prevBtn.addEventListener("click", () => go(-1));
    nextBtn.addEventListener("click", () => go(1));
    book.addEventListener("scroll", () => updateUi(current()), { passive: true });
  }
  updateUi(0);
}

// ─── 印刷 ───
const printRoot = document.getElementById("printRoot");
const printBtn = document.getElementById("printBtn");
const closeBtn = document.getElementById("closePrint");
function openPreview() {
  printRoot.classList.add("is-open");
  document.body.style.overflow = "hidden";
  const s = sheets.querySelector(".sheet");
  if (s) fitSheets(s.offsetWidth);
  printRoot.scrollTop = 0;
  closeBtn.focus();
}
function closePreview() {
  printRoot.classList.remove("is-open");
  document.body.style.overflow = "";
  fitSheets();
  printBtn.focus();
}
function startPrint() {
  sheets.innerHTML = PAGES.map((p, i) =>
    `<p class="sheet-label">${i + 1} / ${total}</p><div class="sheet">${pageHtml(i, true)}</div>`).join("");
  document.getElementById("printTitle").textContent = `印刷するとこうなります（A4縦・${total}枚）`;
  if (CAN_PRINT) {
    printBtn.addEventListener("click", () => { fitSheets(); window.print(); });
  } else {
    document.getElementById("printLabel").textContent = "印刷レイアウトを見る";
    printBtn.addEventListener("click", openPreview);
  }
  closeBtn.addEventListener("click", closePreview);
  window.addEventListener("beforeprint", () => fitSheets());
}

// ─── 表紙の事務所名の色：シートで決めた色、なければロゴマークの色に合わせる ───
function logoColor(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const n = 48;
        const cv = document.createElement("canvas");
        cv.width = cv.height = n;
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, n, n);
        const d = ctx.getImageData(0, 0, n, n).data;
        const count = {};
        for (let i = 0; i < d.length; i += 4) {
          const [r, g, b, a] = [d[i], d[i + 1], d[i + 2], d[i + 3]];
          if (a < 200) continue;                                   // 透明なところ
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          if (max > 235 && min > 215) continue;                    // 白っぽいところ
          if (max - min < 40) continue;                            // 灰色・黒っぽいところ
          const key = [r >> 4, g >> 4, b >> 4].join(",");
          const c = count[key] || (count[key] = { n: 0, r: 0, g: 0, b: 0 });
          c.n++; c.r += r; c.g += g; c.b += b;
        }
        const best = Object.values(count).sort((a, b) => b.n - a.n)[0];
        if (!best || best.n < 20) return resolve("");
        const [r, g, b] = [best.r, best.g, best.b].map(v => Math.round(v / best.n));
        // 白い帯の上で読みにくい明るい色は使わない
        if (0.2126 * r + 0.7152 * g + 0.0722 * b > 190) return resolve("");
        resolve(`rgb(${r}, ${g}, ${b})`);
      } catch (e) { resolve(""); }
    };
    img.onerror = () => resolve("");
    img.src = src;
  });
}
async function applyNameColor() {
  const set = String((C.cover && C.cover.nameColor) || "").trim();
  const color = /^#[0-9a-fA-F]{6}$/.test(set) ? set : ((C.photos || {}).logo ? await logoColor(C.photos.logo) : "");
  if (color) document.documentElement.style.setProperty("--name-color", color);
}

// ─── 起動 ───
async function loadContent() {
  const res = await fetch(CONTENT_URL, { cache: "no-cache" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
function showError() {
  book.innerHTML = `<p class="status">パンフレットを読み込めませんでした。<br>時間をおいて、もう一度開いてください。</p>`;
}

(async function init() {
  try { C = await loadContent(); } catch (e) { showError(); return; }
  C.company = C.company || "";
  withDefaults(C);
  L = C.common;
  IS_SAMPLE = !!C._sample;
  document.getElementById("brand").textContent = `${C.company}　${L.label}`;
  document.getElementById("sampleNote").hidden = !IS_SAMPLE;

  applyNameColor();
  startBook();
  startPrint();
  ["controls", "hint", "printBtn"].forEach(id => { document.getElementById(id).hidden = false; });
  const rights = document.getElementById("rights");
  rights.textContent = String(L.rights || "").trim();
  rights.hidden = !rights.textContent;
  // 写真の上では右クリック・長押しのメニューとドラッグを出さない
  document.addEventListener("contextmenu", e => { if (e.target.closest && e.target.closest(".pg img, .ph, .photo, .cv-bg")) e.preventDefault(); });
  document.addEventListener("dragstart", e => { if (e.target.tagName === "IMG") e.preventDefault(); });

  fitBook();
  fitSheets();
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  fitBook();
  fitSheets();

  let t = null;
  window.addEventListener("resize", () => {
    clearTimeout(t);
    t = setTimeout(() => {
      fitBook();
      if (printRoot.classList.contains("is-open")) { const s = sheets.querySelector(".sheet"); if (s) fitSheets(s.offsetWidth); }
    }, 250);
  });
  document.body.dataset.ready = "1";
})();

document.addEventListener("keydown", e => {
  if (printRoot.classList.contains("is-open")) { if (e.key === "Escape") closePreview(); return; }
  if (!C) return;
  if (e.key === "ArrowRight") nextBtn.click();
  if (e.key === "ArrowLeft") prevBtn.click();
});

// 試作版では申込みボタンを押してもページを開かない
book.addEventListener("click", e => {
  const a = e.target.closest("[data-apply]");
  if (!a || !IS_SAMPLE) return;
  e.preventDefault();
  const msg = a.parentElement.querySelector(".cta-msg");
  if (msg) msg.textContent = "試作版のため、申込みページにはつながりません";
});
</script>
